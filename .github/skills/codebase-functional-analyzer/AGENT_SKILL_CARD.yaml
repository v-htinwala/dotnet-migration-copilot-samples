# ──────────────────────────────────────────────
# AGENT SKILL CARD — codebase-functional-analyzer
# ──────────────────────────────────────────────

# ── Core Metadata ──
name: codebase-functional-analyzer
version: "1.0"
author: functional-test-automation
license: MIT
category: testing
domain: functional-testing
user-invokable: false

# ── Categorization & Discovery ──
description: >
  Deep static analysis of application codebases to extract API endpoints,
  frontend routes, component hierarchies, database models, and functional
  test scenario candidates using framework-specific parsing strategies.
  Generates scenario-candidates.jsonl using feature-based batching
  (default batch_size: 25) for efficient I/O on large codebases.
tags:
  - codebase
  - static-analysis
  - api-endpoints
  - routes
  - models
  - functional-testing
keywords:
  - API catalog
  - route extraction
  - component tree
  - database models
  - middleware
  - validation rules
  - endpoint discovery

# ── Input Requirements ──
inputs:
  required:
    - name: codebase_path
      type: directory_path
      description: Root directory of the application codebase
    - name: tech_stack
      type: file_path
      description: Path to stack-profile.json from tech-stack-detector
    - name: output_dir
      type: directory_path
      description: Output directory for analysis artifacts
  optional:
    - name: batch_size
      type: integer
      default: 25
      description: >
        Max scenario candidates per batch flush. Candidates are grouped by
        feature and flushed in batches to reduce I/O overhead. If a feature
        generates more than batch_size candidates, it is split across
        multiple flushes at candidate-type boundaries.

# ── Output Artifacts ──
outputs:
  primary:
    - name: api-catalog.jsonl
      type: jsonl
      description: One line per API endpoint with method, handler, middleware, auth
    - name: scenario-candidates.jsonl
      type: jsonl
      description: Functional test scenario candidates tagged with source "codebase" (written in feature-grouped batches)
  secondary:
    - name: route-map.json
      type: json
      description: Frontend route tree with page types and component mappings
    - name: component-tree.json
      type: json
      description: Component hierarchy for SPAs
    - name: models.json
      type: json
      description: Database models/entities with fields, types, and validations
    - name: batch-progress.json
      type: json
      description: Batch processing stats — batch count, per-feature breakdown, timing

# ── Dependencies ──
dependencies:
  system: []
  python: []
  notes: >
    No external dependencies. Analysis is purely static file reading and
    pattern matching using the agent's file system access.

# ── Pipeline Position ──
pipeline:
  upstream:
    - tech-stack-detector  # Provides stack-profile.json
  downstream:
    - functional-scenario-merger  # Consumes scenario-candidates.jsonl
    - url-functional-explorer     # Uses component-tree.json for DOM correlation
platform:
  - generic
artifact_type: skill
