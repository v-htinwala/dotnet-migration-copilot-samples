# =============================================================================
# Regression Scenarios Example — Playwright-CLI Discovery Output
# =============================================================================
# This file is generated by the playwright-cli-regression-scenario-generator
# skill from live web application discovery data. It is compatible with the
# regression-orchestrator agent's structured input (user input #11).
#
# Unlike hand-authored scenario files, these scenarios are derived from
# actual application exploration using playwright-cli, so target_routes
# and api_endpoints reflect the real application surface.
# =============================================================================

scenarios:

  - name: OrderManagementFlow
    description: >
      End-to-end regression coverage for the order management workflow
      spanning order listing, creation, detail view, and status updates.
      Discovered via playwright-cli exploration of /orders, /orders/new,
      and /orders/:id routes with 12 interactive elements and 4 API endpoints.
    target_files:
      - "src/features/orders/**"
      - "src/components/OrderForm.tsx"
      - "src/hooks/useOrders.ts"
    target_routes:
      - "/orders"
      - "/orders/new"
      - "/orders/:id"
    api_endpoints:
      - "GET /api/orders"
      - "POST /api/orders"
      - "GET /api/orders/:id"
      - "PUT /api/orders/:id/status"
    expected_behaviors:
      - "Page at /orders should render a list of orders from GET /api/orders"
      - "Table at /orders should display columns: Order ID, Customer, Status, Date"
      - "Clicking column header should sort order list"
      - "Clicking an order row navigates to /orders/:id"
      - "Page at /orders/new should render order creation form"
      - "Form at /orders/new should validate required field 'Customer Name'"
      - "Form at /orders/new should validate required field 'Items'"
      - "Form submission at /orders/new should call POST /api/orders"
      - "Successful order creation should redirect to /orders/:id"
      - "Page at /orders/:id should display order details from GET /api/orders/:id"
      - "Status update button should call PUT /api/orders/:id/status"
      - "Error response from GET /api/orders should show error message"
    requirement_ids:
      - "REQ-ORD-001"
      - "REQ-ORD-002"
      - "REQ-ORD-003"
    priority: critical

  - name: AuthenticationFlow
    description: >
      Regression coverage for authentication including login, session
      management, and protected route access. Discovered auth wall at
      /login with redirect patterns to /dashboard.
    target_files:
      - "src/features/auth/**"
      - "src/context/AuthContext.tsx"
      - "src/components/ProtectedRoute.tsx"
    target_routes:
      - "/login"
      - "/dashboard"
      - "/profile"
    api_endpoints:
      - "POST /api/auth/login"
      - "POST /api/auth/logout"
      - "GET /api/auth/session"
    expected_behaviors:
      - "Login form at /login accepts email and password fields"
      - "Login form at /login should validate required field 'Email'"
      - "Login form at /login should validate email format for 'Email'"
      - "Successful login redirects to /dashboard"
      - "Failed login shows error message without clearing form"
      - "Navigating to /dashboard without auth redirects to /login"
      - "Navigating to /profile without auth redirects to /login"
      - "Authenticated user can access /dashboard"
      - "Logout clears session and redirects to /login"
      - "Session persists across page reloads"
    requirement_ids:
      - "REQ-AUTH-001"
    priority: critical

  - name: ProductSearchFlow
    description: >
      Search functionality across the product catalog including search input,
      results filtering, and result navigation. Discovered search component
      with debounced API calls and filter controls.
    target_files:
      - "src/features/search/**"
      - "src/components/SearchBar.tsx"
      - "src/hooks/useSearch.ts"
    target_routes:
      - "/products"
      - "/products/search"
    api_endpoints:
      - "GET /api/products?q=query&category=cat&sort=field"
    expected_behaviors:
      - "Search input at /products accepts text and triggers search"
      - "Search results update after typing with debounce delay"
      - "Filter dropdown filters products by category"
      - "Sort dropdown sorts results by selected field"
      - "Empty search results show appropriate empty state"
      - "Clicking a search result navigates to /products/:id"
      - "Search query persists in URL query parameters"
      - "Direct URL with query parameters shows filtered results"
    requirement_ids:
      - "REQ-SEARCH-001"
    priority: high

  - name: UserSettingsFlow
    description: >
      User settings management including profile editing, notification
      preferences, and account actions. Discovered settings tabs with
      auto-save behavior.
    target_files:
      - "src/features/settings/**"
      - "src/components/SettingsTabs.tsx"
    target_routes:
      - "/settings"
      - "/settings/profile"
      - "/settings/notifications"
    api_endpoints:
      - "GET /api/users/me"
      - "PUT /api/users/me"
      - "PUT /api/users/me/notifications"
    expected_behaviors:
      - "Settings page at /settings renders tab navigation"
      - "Tab 'Profile' switches to profile editing form"
      - "Tab 'Notifications' switches to notification preferences"
      - "Profile form pre-fills with data from GET /api/users/me"
      - "Profile form validates required field 'Display Name'"
      - "Profile save calls PUT /api/users/me with updated data"
      - "Notification toggles update preferences via PUT /api/users/me/notifications"
      - "Success message appears after saving settings"
    requirement_ids:
      - "REQ-SET-001"
    priority: medium

  - name: ModalConfirmationFlow
    description: >
      Confirmation modal interactions for destructive actions including
      delete confirmations, status change warnings, and bulk operations.
      Discovered modal patterns on /orders and /admin/users routes.
    target_files:
      - "src/components/ConfirmDialog.tsx"
      - "src/components/Modal.tsx"
    target_routes:
      - "/orders"
      - "/admin/users"
    api_endpoints:
      - "DELETE /api/orders/:id"
      - "DELETE /api/users/:id"
    expected_behaviors:
      - "Delete button opens confirmation modal"
      - "Modal displays warning message with entity name"
      - "Modal can be dismissed via Escape key"
      - "Modal can be dismissed by clicking outside"
      - "Modal confirm triggers DELETE /api/orders/:id"
      - "Successful deletion removes item from list"
      - "Modal cancel returns to previous state without changes"
      - "Focus returns to trigger element after modal closes"
    requirement_ids:
      - "REQ-MOD-001"
    priority: medium
