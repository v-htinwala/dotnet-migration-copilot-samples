name: Deploy Infrastructure

on:
  # Automatic triggers are disabled - use workflow_dispatch to run manually
  push:
    branches:
      - main
      - upgrade-to-NET8
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches:
      - main
      - upgrade-to-NET8
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    # environment: dev

    defaults:
      run:
        shell: bash
        working-directory: ./infrastructure/terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Init
      run: terraform init
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Terraform Format
      run: terraform fmt -check
      continue-on-error: true

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      id: plan
      run: |
        # Note: Non-secret values come from dev.tfvars (committed to Git)
        # SQL password is AUTO-GENERATED by Terraform and stored in Key Vault
        # Only Entra ID secrets need to be passed if authentication is enabled
        if [ "${{ vars.ENABLE_ENTRA_ID_AUTH }}" == "true" ]; then
          terraform plan -no-color -out=tfplan \
            -var-file=dev.tfvars \
            -var="enable_entra_id_auth=true" \
            -var="entra_client_id=${{ secrets.ENTRA_CLIENT_ID }}" \
            -var="entra_tenant_id=${{ secrets.ENTRA_TENANT_ID }}" \
            -var="entra_client_secret=${{ secrets.ENTRA_CLIENT_SECRET }}"
        else
          terraform plan -no-color -out=tfplan \
            -var-file=dev.tfvars \
            -var="enable_entra_id_auth=false"
        fi
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Comment PR with Plan
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const output = `#### Terraform Format and Style ??\`${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ??\`${{ steps.init.outcome }}\`
          #### Terraform Validation ??\`${{ steps.validate.outcome }}\`
          #### Terraform Plan ??\`${{ steps.plan.outcome }}\`

          <details><summary>Show Plan</summary>

          \`\`\`terraform
          ${{ steps.plan.outputs.stdout }}
          \`\`\`

          </details>

          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Apply
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upgrade-to-NET8') && github.event_name == 'push'
      run: terraform apply -auto-approve tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Terraform Apply (Manual)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
      run: terraform apply -auto-approve tfplan
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Terraform Destroy (Manual)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
      run: |
        if [ "${{ vars.ENABLE_ENTRA_ID_AUTH }}" == "true" ]; then
          terraform destroy -auto-approve \
            -var-file=dev.tfvars \
            -var="enable_entra_id_auth=true" \
            -var="entra_client_id=${{ secrets.ENTRA_CLIENT_ID }}" \
            -var="entra_tenant_id=${{ secrets.ENTRA_TENANT_ID }}" \
            -var="entra_client_secret=${{ secrets.ENTRA_CLIENT_SECRET }}"
        else
          terraform destroy -auto-approve \
            -var-file=dev.tfvars \
            -var="enable_entra_id_auth=false"
        fi
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
